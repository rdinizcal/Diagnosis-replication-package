name: artifact-evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Release checks
        run: python3 scripts/release_audit.py

      - name: Build the locked environment
        run: docker build --pull -t diagnosis-replication -f environment/Dockerfile .

      - name: Smoke test
        run: docker run --rm --network none diagnosis-replication ./run smoke

      - name: Regenerate and verify every result, then run the tests
        run: |
          docker run --rm --network none diagnosis-replication sh -c \
            './run results && python3 -m pytest -q tests experiments/implementation_fix'
